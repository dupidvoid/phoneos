<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e8ee;--fg:#111;--card:#fff;--line:#d9dbe1;--mut:#777;--blue:#0a84ff}

.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#000;border-radius:20px;z-index:4}
.fill{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.pill{height:5px;width:130px;background:#fff;border-radius:3px;margin:8px auto 8px;opacity:.9;cursor:pointer;flex:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.lock{align-items:center;text-align:center;padding-top:50px}
.lock .t{font-size:78px;font-weight:300;line-height:1}.lock .d{font-size:18px;margin-top:6px}
.dots{display:flex;gap:14px;margin:26px 0 18px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}

.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:14px 18px}

.widget{margin:6px 18px;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px)}

.app{background:var(--card);color:var(--fg);flex:1;display:flex;flex-direction:column;min-height:0}

.mut{color:var(--mut);font-size:13px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{background:var(--blue);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;width:100%;margin:6px 0}
.btn.s{width:auto;padding:6px 14px;margin:0;font-size:13px;border-radius:16px}.btn.g{background:var(--line);color:var(--fg)}
.chat{display:flex;flex-direction:column;gap:6px}

.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:54px;height:54px;border-radius:12px;border:2px solid var(--line)}
.err{color:#ff453a;font-size:13px;min-height:18px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc button{padding:16px;border-radius:14px;background:var(--line);font-size:20px;color:var(--fg)}
.disp{font-size:38px;text-align:right;padding:16px 4px;min-height:80px;word-break:break-all}
h4{margin:16px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.vt{width:15px;height:15px;vertical-align:-2px;margin-left:4px}
.body{position:relative}.b img,.b video{max-width:100%;border-radius:12px;display:block}.b .x{opacity:.5;font-size:11px;cursor:pointer;display:block;text-align:right}
.att{display:grid;place-items:center;width:38px;height:38px;cursor:pointer;font-size:20px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pg img,.pg video{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}
.gb{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:min(100%,300px);aspect-ratio:1;margin:12px auto}.gb i{background:rgba(128,128,128,.22);border-radius:5px}
.gt{display:flex;justify-content:space-around;align-items:center;min-height:100px}.gp{display:grid;gap:2px;grid-auto-rows:22px;touch-action:none;cursor:grab;min-width:30px}.gp i{border-radius:4px}
.gh{position:fixed;display:grid;gap:2px;grid-template-columns:repeat(var(--n),var(--s));grid-auto-rows:var(--s);pointer-events:none;z-index:99;opacity:.9}.gh i{border-radius:5px}
.go{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);color:#fff}
.tk{position:relative;flex:1;background:#000;color:#fff;min-height:0}
.tkf{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}.tkf::-webkit-scrollbar{display:none}
.tv{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always}.tv canvas{width:100%;height:100%;display:block}
.tr{position:absolute;right:8px;bottom:70px;display:flex;flex-direction:column;gap:14px;align-items:center}.tr button{background:none;font-size:30px;display:flex;flex-direction:column;align-items:center;color:#fff}.tr small{font-size:12px}
.tb{position:absolute;left:12px;right:70px;bottom:14px;text-shadow:0 1px 3px #000;font-size:14px}
.tkh{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px 14px;z-index:2;text-shadow:0 1px 3px #000}.tkh button{font-size:22px;background:none;color:#fff}
.tabs{display:flex;gap:8px;overflow:auto;margin:6px 0}.tabs button{padding:6px 14px;border-radius:16px;background:var(--line);color:var(--fg);white-space:nowrap}.tabs .on{background:var(--blue);color:#fff}
.hero{border-radius:20px;padding:18px;color:#fff;margin:8px 0}.hero h2{margin:4px 0}.hero p{margin:0 0 10px;opacity:.9}.hero small{opacity:.8;letter-spacing:.06em}
.dlb{width:80px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.dlb i{display:block;height:100%;background:var(--blue);width:0}.stb{display:flex;gap:6px;align-items:center}
</style></head><body>

<script>

function head(t,left,right){return `<div class="h"><span>${left||""}</span><span>${t}</span><span>${right||""}</span></div>`}
function render(){

const ic=(id,n,e,c)=>`<button class="ic" data-a="open" data-v="${id}"><b style="background:${c}">${e}</b>${n}</button>`;
function gate(back){return head("Account",back)+`<div class="body"><p><b>Sign up or log in</b></p><p class="mut">${db?"Pick a username and password. Friends add you in Contacts by typing your username.":"Backend not set up yet. See the README."}</p>${db?`<input id="un" placeholder="username (a-z, 0-9, _)" maxlength="16" autocapitalize="off"><input id="pw" type="password" placeholder="password (6+ characters)"><div class="err">${esc(S.err)}</div><button class="btn" data-a="signup">Sign up</button><button class="btn g" data-a="login">Log in</button>`:""}</div>`}

  f.addEventListener("scroll",()=>{if(f.scrollTop+f.clientHeight*2>f.scrollHeight){const n=TK.length;for(let i=0;i<4;i++)TK.push(tkMake());mount(n)}});
  if(!tkRun){tkRun=true;const loop=t=>{if(!$("#tkf")){tkRun=false;return}TK.forEach(a=>{if(a.vis&&a.x)TKV[a.st](a.x,270,480,t/1000,a)});requestAnimationFrame(loop)};requestAnimationFrame(loop)}}
$("#scr").addEventListener("dblclick",e=>{const v=e.target.closest(".tv");if(v&&!e.target.closest("button")){const i=+v.dataset.i;if(!TK[i].liked)tkLike(i)}});
const CATS=["Today","Games","Social","Tools"];
const stBtn=a=>S.inst.includes(a.id)?`<button class="btn s" data-a="open" data-v="${a.id}">Open</button><button class="btn s g" data-a="uninst" data-v="${a.id}">✕</button>`:S.dl[a.id]!=null?`<div class="dlb"><i class="dl-${a.id}" style="width:${S.dl[a.id]}%"></i></div>`:`<button class="btn s" data-a="inst" data-v="${a.id}">Get</button>`;
function stList(){const q=(S.sq||"").toLowerCase(),t=S.stab||"Today";return STORE.filter(a=>(t==="Today"||a.cat===t)&&(!q||(a.n+a.d).toLowerCase().includes(q))).map(a=>`<div class="row"><div class="av" style="background:${a.c};border-radius:14px;width:54px;height:54px;font-size:28px">${a.e}</div><div class="grow"><b>${a.n}</b><div class="mut">${a.cat} · ★ ${a.r}</div><div class="mut ell">${a.d}</div></div><div class="stb">${stBtn(a)}</div></div>`).join("")||`<p class="mut">No apps found.</p>`}
function storeView(back){const t=S.stab||"Today",f=STORE[0];return head("App Store",back)+`<div class="body"><input id="sq" placeholder="🔍 Search apps" value="${esc(S.sq||"")}"><div class="tabs">${CATS.map(c=>`<button class="${c===t?"on":""}" data-a="stab" data-v="${c}">${c}</button>`).join("")}</div>${t==="Today"&&!S.sq?`<div class="hero" style="background:${f.c}"><small>GAME OF THE DAY</small><h2>${f.e} ${f.n}</h2><p>${f.d}</p><div class="stb">${stBtn(f)}</div></div><h4>Top free apps</h4>`:""}<div id="stl">${stList()}</div></div>`}
function dlStart(id){if(S.dl[id]!=null)return;S.dl[id]=0;document.querySelectorAll(`[data-a="inst"][data-v="${id}"]`).forEach(b=>b.parentElement.innerHTML=stBtn({id}));
  const t=setInterval(()=>{S.dl[id]+=6+Math.random()*16;if(S.dl[id]>=100){clearInterval(t);delete S.dl[id];S.inst.push(id);ls.s("mp_inst",S.inst);render();return}document.querySelectorAll(".dl-"+id).forEach(e=>e.style.width=S.dl[id]+"%")},150)}
const ago=t=>{const m=(Date.now()-t)/6e4|0;return m<1?"now":m<60?m+"m":m<1440?(m/60|0)+"h":(m/1440|0)+"d"};
function chList(){return S.posts.map(p=>{const lk=(p.likes||[]).includes(S.me);return `<div class="row" style="align-items:flex-start"><div class="av">${esc(p.user[0].toUpperCase())}</div><div class="grow"><b>${nm(p.user)}</b> <span class="mut">@${esc(p.user)} · ${ago(p.ts)}</span><div style="white-space:pre-wrap;word-wrap:break-word">${esc(p.text)}</div><div style="margin-top:6px"><button data-a="plike" data-v="${p.id}" style="background:none;color:${lk?"#f91880":"var(--mut)"}">${lk?"❤️":"🤍"} ${(p.likes||[]).length}</button>${p.user===S.me||ADMINS.includes(S.me)?` <button data-a="pdl" data-v="${p.id}" style="background:none;color:var(--mut)">🗑</button>`:""}</div></div></div>`}).join("")||`<p class="mut">No posts yet. Be the first!</p>`}
let psub=false;
function pSub(){if(psub||!db)return;psub=true;db.collection("posts").orderBy("ts","desc").limit(60).onSnapshot(q=>{S.posts=docs(q);const f=$("#pf");if(f&&S.app==="chirp")f.innerHTML=chList()},()=>{})}
$("#scr").addEventListener("input",e=>{const t=e.target;if(t.id==="sq"){S.sq=t.value;$("#stl").innerHTML=stList()}if(t.id==="gname")S.ng.name=t.value});
let subbed=false;
function subs(){if(subbed||!db||!S.me)return;subbed=true;
  db.collection("verified").onSnapshot(q=>{S.ver={};docs(q).forEach(x=>S.ver[x.id]=x);updChat();if(!S.app||S.app==="settings")render()},()=>{});
  db.collection("groups").where("uids","array-contains",uid).onSnapshot(q=>{S.groups={};docs(q).forEach(x=>S.groups[x.id]=x);updChat()},()=>{});
  db.collection("gmsgs").where("uids","array-contains",uid).onSnapshot(q=>{S.gm={};docs(q).forEach(x=>S.gm[x.id]=x);updChat()},()=>{});
  pSub();
  db.collection("contacts").where("owner","==",S.me).onSnapshot(s=>{S.contacts=docs(s).map(x=>x.user);updChat()},()=>{});
  db.collection("msgs").where("to","==",S.me).onSnapshot(s=>{S.inbox={};docs(s).forEach(x=>S.inbox[x.id]=x);updChat()},()=>{});
  db.collection("msgs").where("from","==",S.me).onSnapshot(s=>{S.outbox={};docs(s).forEach(x=>S.outbox[x.id]=x);updChat()},()=>{});}
setInterval(()=>{const c=$(".clk");if(c)c.textContent=hm()},15000);
render();
(async()=>{try{if(window.firebase&&FIREBASE_CONFIG.apiKey!=="YOUR_API_KEY"){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();S.online=true;
  auth.onAuthStateChanged(async u=>{if(!u||S.me)return;uid=u.uid;try{const d=docs(await db.collection("accounts").where("uid","==",uid).get());if(d.length){S.me=d[0].id;subs();render()}}catch(e){}});}}catch(e){}
  render()})();
</script></body></html>
