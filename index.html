<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPhone</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><meta name="color-scheme" content="light dark">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e8ee;--fg:#111;--card:#fff;--line:#d9dbe1;--mut:#777;--blue:#0a84ff}

:root[data-theme="dark"]{--bg:#0c0d11;--fg:#eee;--card:#1c1d22;--line:#2d2e35;--mut:#999}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(390px,100vw);height:min(820px,100%);background:#000;border-radius:48px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 0 2px #333}
@media(max-width:430px){.phone{border-radius:0;padding:0;box-shadow:none}}
.scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;color:#fff;display:flex;flex-direction:column;background-size:cover}

.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-weight:600;font-size:14px;z-index:3}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#000;border-radius:20px;z-index:4}
.fill{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.pill{height:5px;width:130px;background:#fff;border-radius:3px;margin:8px auto 8px;opacity:.9;cursor:pointer;flex:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.lock{align-items:center;text-align:center;padding-top:50px}

.dots{display:flex;gap:14px;margin:26px 0 18px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.22);font-size:28px;backdrop-filter:blur(10px)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:14px 18px}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;font-size:11px}
.ic b{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.dock{margin:auto 12px 4px;padding:12px;border-radius:28px;background:rgba(255,255,255,.25);backdrop-filter:blur(14px);display:flex;justify-content:space-around}
.widget{margin:6px 18px;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px)}
.widget .t{font-size:44px;font-weight:300}
.app{background:var(--card);color:var(--fg);flex:1;display:flex;flex-direction:column;min-height:0}
.app .h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--line);flex:none}
.app .h button{background:none;color:var(--blue);font-size:15px;font-weight:500}
.body{flex:1;overflow:auto;padding:12px 16px;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:var(--fg)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8e9bff,#ff8ec5);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.mut{color:var(--mut);font-size:13px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;width:100%;margin:6px 0}
.btn.s{width:auto;padding:6px 14px;margin:0;font-size:13px;border-radius:16px}.btn.g{background:var(--line);color:var(--fg)}
.chat{display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:8px 13px;border-radius:19px;word-wrap:break-word}.b.me{align-self:flex-end;background:var(--blue);color:#fff}.b.th{align-self:flex-start;background:var(--line)}
.send{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex:none}.send input{margin:0;border-radius:20px}.send button{background:var(--blue);color:#fff;border-radius:50%;width:38px;height:38px;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:54px;height:54px;border-radius:12px;border:2px solid var(--line)}
.err{color:#ff453a;font-size:13px;min-height:18px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc button{padding:16px;border-radius:14px;background:var(--line);font-size:20px;color:var(--fg)}
.disp{font-size:38px;text-align:right;padding:16px 4px;min-height:80px;word-break:break-all}
