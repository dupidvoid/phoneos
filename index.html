<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPhone | MP </title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><meta name="color-scheme" content="light dark">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6e8ee;--fg:#111;--card:#fff;--line:#d9dbe1;--mut:#777;--blue:#0a84ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d11;--fg:#eee;--card:#1c1d22;--line:#2d2e35;--mut:#999}}
:root[data-theme="dark"]{--bg:#0c0d11;--fg:#eee;--card:#1c1d22;--line:#2d2e35;--mut:#999}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(390px,100vw);height:min(820px,100%);background:#000;border-radius:48px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 0 2px #333}
@media(max-width:430px){.phone{border-radius:0;padding:0;box-shadow:none}}
.scr{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;color:#fff;display:flex;flex-direction:column;background-size:cover}
@media(max-width:430px){.scr{border-radius:0}}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 4px;font-weight:600;font-size:14px;z-index:3}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:100px;height:26px;background:#000;border-radius:20px;z-index:4}
.fill{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.pill{height:5px;width:130px;background:#fff;border-radius:3px;margin:8px auto 8px;opacity:.9;cursor:pointer;flex:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.lock{align-items:center;text-align:center;padding-top:50px}
.lock .t{font-size:78px;font-weight:300;line-height:1}.lock .d{font-size:18px;margin-top:6px}
.dots{display:flex;gap:14px;margin:26px 0 18px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}.dots i.on{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.22);font-size:28px;backdrop-filter:blur(10px)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;padding:14px 18px}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;font-size:11px}
.ic b{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.dock{margin:auto 12px 4px;padding:12px;border-radius:28px;background:rgba(255,255,255,.25);backdrop-filter:blur(14px);display:flex;justify-content:space-around}
.widget{margin:6px 18px;padding:14px 18px;border-radius:22px;background:rgba(255,255,255,.22);backdrop-filter:blur(14px)}
.widget .t{font-size:44px;font-weight:300}
.app{background:var(--card);color:var(--fg);flex:1;display:flex;flex-direction:column;min-height:0}
.app .h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-weight:700;font-size:18px;border-bottom:1px solid var(--line);flex:none}
.app .h button{background:none;color:var(--blue);font-size:15px;font-weight:500}
.body{flex:1;overflow:auto;padding:12px 16px;min-height:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left;color:var(--fg)}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#8e9bff,#ff8ec5);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.mut{color:var(--mut);font-size:13px}.grow{flex:1;min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;width:100%;margin:6px 0}
.btn.s{width:auto;padding:6px 14px;margin:0;font-size:13px;border-radius:16px}.btn.g{background:var(--line);color:var(--fg)}
.chat{display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:8px 13px;border-radius:19px;word-wrap:break-word}.b.me{align-self:flex-end;background:var(--blue);color:#fff}.b.th{align-self:flex-start;background:var(--line)}
.send{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex:none}.send input{margin:0;border-radius:20px}.send button{background:var(--blue);color:#fff;border-radius:50%;width:38px;height:38px;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:54px;height:54px;border-radius:12px;border:2px solid var(--line)}
.err{color:#ff453a;font-size:13px;min-height:18px}.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc button{padding:16px;border-radius:14px;background:var(--line);font-size:20px;color:var(--fg)}
.disp{font-size:38px;text-align:right;padding:16px 4px;min-height:80px;word-break:break-all}
h4{margin:16px 0 4px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
</style></head><body>
<div class="phone"><div class="notch"></div><div class="scr" id="scr"></div></div>
<script>
// Password Stuff
const PASS="19723";
//End of Password Stuff

const FIREBASE_CONFIG={apiKey:"AIzaSyAJMqSu4uKXkwYVyBFDoj2y8RxgI9A6Sgw",authDomain:"phoneosmy-8336d.firebaseapp.com",projectId:"phoneosmy-8336d",appId:"1:218936377234:web:b5ed3895099473b9338b4b"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PRESETS=[["#4facfe","#00f2fe",160],["#ff6a88","#ff99ac",135],["#7f00ff","#e100ff",150],["#232526","#414345",160],["#f7971e","#ffd200",135],["#11998e","#38ef7d",150]];
const STORE=[{id:"calc",n:"Calculator",e:"➗",c:"#ff9f0a",d:"Quick maths"},{id:"notes",n:"Notes",e:"📝",c:"#ffd60a",d:"Jot things down"},{id:"watch",n:"Stopwatch",e:"⏱️",c:"#30d158",d:"Time anything"}];
let S={locked:true,pin:"",app:null,sub:null,me:null,wp:ls.g("mp_wp",{t:"g",c1:"#4facfe",c2:"#00f2fe",a:160}),inst:ls.g("mp_inst",[]),contacts:[],inbox:{},outbox:{},err:"",online:false,calc:"",sw:{on:false,t:0,s:0}};
let db=null,auth=null,uid=null,swT=null;
const bg=w=>w.t==="img"?`url("${w.u}") center/cover`:`linear-gradient(${w.a}deg,${w.c1},${w.c2})`;
const docs=r=>(r.docs||[]).map(x=>({id:x.id,...x.data()}));
const now=()=>new Date();
const hm=()=>now().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const msgs=()=>Object.values({...S.inbox,...S.outbox}).sort((a,b)=>a.ts-b.ts);
const key=(a,b)=>[a,b].sort().join("__");
const bar=()=>`<div class="bar"><span class="clk">${hm()}</span><span>${S.online?"●":"○"} 4G</span></div>`;
const pill=()=>`<div class="pill" data-a="home"></div>`;
function head(t,left,right){return `<div class="h"><span>${left||""}</span><span>${t}</span><span>${right||""}</span></div>`}
function render(){
  const el=$("#scr");el.style.background=bg(S.wp);
  if(S.locked){
    el.innerHTML=`${bar()}<div class="fill lock"><div class="t">${hm()}</div><div class="d">${now().toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})}</div><div style="margin-top:50px">Enter Passcode</div><div class="dots" id="dots">${[0,1,2,3,4].map(i=>`<i class="${i<S.pin.length?"on":""}"></i>`).join("")}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-a="key" data-v="${k}">${k}</button>`).join("")}</div></div>`;return}
  if(!S.app){
    const extra=S.inst.map(id=>STORE.find(a=>a.id===id)).filter(Boolean);
    el.innerHTML=`${bar()}<div class="fill"><div class="widget"><div class="t">${hm()}</div><div>${now().toLocaleDateString([],{weekday:"long",day:"numeric",month:"short"})}</div>${S.me?`<div class="mut" style="color:#fffc">@${esc(S.me)}</div>`:""}</div><div class="grid">${extra.map(a=>ic(a.id,a.n,a.e,a.c)).join("")}</div><div class="dock">${ic("messages","Messages","💬","#30d158")}${ic("contacts","Contacts","👥","#8e8e93")}${ic("store","App Store","🌐","#0a84ff")}${ic("settings","Settings","⚙️","#636366")}</div>${pill()}</div>`;return}
  const A=S.app,back=`<button data-a="home">‹ Home</button>`;let inner="";
  if(["messages","contacts"].includes(A)&&!S.me)inner=gate(back);
  else if(A==="messages")inner=S.sub?chatView():msgList(back);
  else if(A==="contacts")inner=contactsView(back);
  else if(A==="store")inner=head("App Store",back)+`<div class="body">${STORE.map(a=>`<div class="row"><div class="av" style="background:${a.c}">${a.e}</div><div class="grow"><b>${a.n}</b><div class="mut">${a.d}</div></div>${S.inst.includes(a.id)?`<button class="btn s g" data-a="uninst" data-v="${a.id}">Remove</button>`:`<button class="btn s" data-a="inst" data-v="${a.id}">Get</button>`}</div>`).join("")}</div>`;
  else if(A==="settings")inner=settings(back);
  else if(A==="calc")inner=head("Calculator",back)+`<div class="body"><div class="disp">${esc(S.calc||"0")}</div><div class="calc">${["7","8","9","/","4","5","6","*","1","2","3","-","0",".","=","+","C","(",")","⌫"].map(k=>`<button data-a="ck" data-v="${k}">${k}</button>`).join("")}</div></div>`;
  else if(A==="notes")inner=head("Notes",back)+`<div class="body"><textarea id="note" rows="16" placeholder="Write something…">${esc(ls.g("mp_note",""))}</textarea></div>`;
  else if(A==="watch")inner=head("Stopwatch",back)+`<div class="body"><div class="disp" id="swd">${fmt()}</div><button class="btn" data-a="swgo">${S.sw.on?"Stop":"Start"}</button><button class="btn g" data-a="swreset">Reset</button></div>`;
  el.innerHTML=`${bar()}<div class="app">${inner}</div>${pill()}`;
  const c=$("#chatbox");if(c)c.scrollTop=c.scrollHeight;
}
const ic=(id,n,e,c)=>`<button class="ic" data-a="open" data-v="${id}"><b style="background:${c}">${e}</b>${n}</button>`;
function gate(back){return head("Account",back)+`<div class="body"><p><b>Sign up or log in</b></p><p class="mut">${db?"Pick a username and password. Friends add you in Contacts by typing your username.":"Backend not set up yet. See the README."}</p>${db?`<input id="un" placeholder="username (a-z, 0-9, _)" maxlength="16" autocapitalize="off"><input id="pw" type="password" placeholder="password (6+ characters)"><div class="err">${esc(S.err)}</div><button class="btn" data-a="signup">Sign up</button><button class="btn g" data-a="login">Log in</button>`:""}</div>`}
function msgList(back){
  const m=msgs(),partners=new Set(S.contacts);m.forEach(x=>partners.add(x.from===S.me?x.to:x.from));
  const rows=[...partners].map(p=>{const l=m.filter(x=>x.convo===key(S.me,p)).pop();return {p,l}}).sort((a,b)=>(b.l?b.l.ts:0)-(a.l?a.l.ts:0));
  return head("Messages",back)+`<div class="body">${rows.length?rows.map(({p,l})=>`<button class="row" data-a="chat" data-v="${esc(p)}"><div class="av">${esc(p[0].toUpperCase())}</div><div class="grow"><b>${esc(p)}</b><div class="mut ell">${l?esc(l.text):"No messages yet"}</div></div></button>`).join(""):`<p class="mut">No chats yet. Add someone in Contacts first.</p>`}</div>`}
function chatBody(){return msgs().filter(x=>x.convo===key(S.me,S.sub)).map(x=>`<div class="b ${x.from===S.me?"me":"th"}">${esc(x.text)}</div>`).join("")||`<p class="mut" style="text-align:center">Say hi 👋</p>`}
function chatView(){return head(esc(S.sub),`<button data-a="chats">‹ Chats</button>`)+`<div class="body chat" id="chatbox">${chatBody()}</div><div class="send"><input id="msg" placeholder="iMessage" autocomplete="off"><button data-a="send">↑</button></div>`}
function contactsView(back){return head("Contacts",back)+`<div class="body"><input id="cu" placeholder="Add by username" autocapitalize="off"><div class="err">${esc(S.err)}</div><button class="btn" data-a="addc">Add contact</button>${S.contacts.sort().map(c=>`<div class="row"><div class="av">${esc(c[0].toUpperCase())}</div><div class="grow"><b>${esc(c)}</b></div><button class="btn s" data-a="chat" data-v="${esc(c)}">Message</button><button class="btn s g" data-a="delc" data-v="${esc(c)}">✕</button></div>`).join("")}</div>`}
function settings(back){const w=S.wp;return head("Settings",back)+`<div class="body"><h4>Account</h4><div class="row"><div class="grow">${S.me?"@"+esc(S.me):"Not signed in"}</div></div><h4>Wallpaper</h4><div class="sw">${PRESETS.map((p,i)=>`<button data-a="preset" data-v="${i}" style="background:linear-gradient(${p[2]}deg,${p[0]},${p[1]})"></button>`).join("")}</div><h4>Custom gradient</h4><div style="display:flex;gap:10px;align-items:center"><input type="color" id="c1" value="${w.c1||"#4facfe"}" data-a="wp"><input type="color" id="c2" value="${w.c2||"#00f2fe"}" data-a="wp"></div><div class="mut">Angle</div><input type="range" id="ang" min="0" max="360" value="${w.a||160}" data-a="wp"><h4>Photo</h4><input type="file" id="img" accept="image/*"><button class="btn g" data-a="wpreset">Reset wallpaper</button><button class="btn" data-a="lock">Lock phone</button></div>`}
const fmt=()=>{const t=S.sw.t+(S.sw.on?Date.now()-S.sw.s:0);return (t/1000).toFixed(2)+"s"};
function setWp(w){S.wp=w;ls.s("mp_wp",w);$("#scr").style.background=bg(w)}
function evalCalc(){try{if(!/^[0-9+\-*/.() ]+$/.test(S.calc))return;const r=Function(`"use strict";return(${S.calc})`)();S.calc=String(+(+r).toPrecision(12))}catch(e){S.calc="Error"}}
function updChat(){const c=$("#chatbox");if(c&&S.app==="messages"&&S.sub){c.innerHTML=chatBody();c.scrollTop=c.scrollHeight}else if(S.app==="messages"&&!S.sub||S.app==="contacts")render()}
async function act(a,v){
  S.err="";
  if(a==="key"){S.pin=v==="⌫"?S.pin.slice(0,-1):(S.pin+v).slice(0,5);if(S.pin.length===5){if(S.pin===PASS){S.locked=false;S.pin="";render()}else{render();const d=$("#dots");d.classList.add("shake");S.pin="";setTimeout(render,400)}}else render();return}
  if(a==="home"){S.app=null;S.sub=null;render()}
  else if(a==="open"){S.app=v;S.sub=null;render()}
  else if(a==="lock"){S.locked=true;S.app=null;render()}
  else if(a==="inst"||a==="uninst"){S.inst=a==="inst"?[...S.inst,v]:S.inst.filter(x=>x!==v);ls.s("mp_inst",S.inst);render()}
  else if(a==="preset"){const p=PRESETS[v];setWp({t:"g",c1:p[0],c2:p[1],a:p[2]});render()}
  else if(a==="wpreset"){setWp({t:"g",c1:"#4facfe",c2:"#00f2fe",a:160});render()}
  else if(a==="chat"){S.app="messages";S.sub=v;render()}
  else if(a==="chats"){S.sub=null;render()}
  else if(a==="ck"){if(v==="C")S.calc="";else if(v==="⌫")S.calc=S.calc.slice(0,-1);else if(v==="=")evalCalc();else S.calc=(S.calc==="Error"?"":S.calc)+v;render()}
  else if(a==="swgo"){if(S.sw.on){S.sw.t+=Date.now()-S.sw.s;S.sw.on=false;clearInterval(swT)}else{S.sw.on=true;S.sw.s=Date.now();swT=setInterval(()=>{const d=$("#swd");d?d.textContent=fmt():clearInterval(swT)},50)}render()}
  else if(a==="swreset"){S.sw={on:false,t:0,s:0};clearInterval(swT);render()}
  else if(a==="signup"||a==="login"){
    const u=($("#un").value||"").trim().toLowerCase(),p=$("#pw").value||"";
    if(!/^[a-z0-9_]{3,16}$/.test(u)){S.err="Username: 3–16 letters, numbers or underscores.";return render()}
    if(p.length<6){S.err="Password must be 6+ characters.";return render()}
    try{const em=u+"@myphone.app";
      if(a==="signup"){const c=await auth.createUserWithEmailAndPassword(em,p);uid=c.user.uid;await db.doc("accounts/"+u).set({uid,created:Date.now()})}
      else{const c=await auth.signInWithEmailAndPassword(em,p);uid=c.user.uid}
      S.me=u;subs()}catch(e){S.err=a==="signup"?"Couldn’t sign up. That username may be taken.":"Wrong username or password."}
    render()}
  else if(a==="addc"){
    const u=($("#cu").value||"").trim().toLowerCase();
    if(!u||u===S.me){S.err="Enter someone else’s username.";return render()}
    try{const d=await db.doc("accounts/"+u).get();const ex=typeof d.exists==="function"?d.exists():d.exists;
      if(!ex){S.err="No user called “"+u+"”.";return render()}
      await db.doc("contacts/"+S.me+"__"+u).set({owner:S.me,user:u})}catch(e){S.err="Couldn’t add contact. Did you spell it right?"}
    render()}
  else if(a==="delc"){try{await db.doc("contacts/"+S.me+"__"+v).delete()}catch(e){}}
  else if(a==="send"){const i=$("#msg"),t=i.value.trim();if(!t)return;i.value="";try{await db.collection("msgs").add({convo:key(S.me,S.sub),from:S.me,to:S.sub,text:t.slice(0,1000),ts:Date.now()})}catch(e){i.value=t}}
}
$("#scr").addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName==="INPUT")return;act(t.dataset.a,t.dataset.v)});
$("#scr").addEventListener("input",e=>{if(e.target.dataset.a==="wp")setWp({t:"g",c1:$("#c1").value,c2:$("#c2").value,a:+$("#ang").value});if(e.target.id==="note")ls.s("mp_note",e.target.value)});
$("#scr").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="msg")act("send");if(e.key==="Enter"&&e.target.id==="cu")act("addc");if(e.key==="Enter"&&e.target.id==="un")act("signup")});
$("#scr").addEventListener("change",e=>{if(e.target.id!=="img"||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);setWp({t:"i",u:c.toDataURL("image/jpeg",.8)})};im.src=r.result};r.readAsDataURL(e.target.files[0])});
let subbed=false;
function subs(){if(subbed||!db||!S.me)return;subbed=true;
  db.collection("contacts").where("owner","==",S.me).onSnapshot(s=>{S.contacts=docs(s).map(x=>x.user);updChat()},()=>{});
  db.collection("msgs").where("to","==",S.me).onSnapshot(s=>{S.inbox={};docs(s).forEach(x=>S.inbox[x.id]=x);updChat()},()=>{});
  db.collection("msgs").where("from","==",S.me).onSnapshot(s=>{S.outbox={};docs(s).forEach(x=>S.outbox[x.id]=x);updChat()},()=>{});}
setInterval(()=>{const c=$(".clk");if(c)c.textContent=hm()},15000);
render();
(async()=>{try{if(window.firebase&&FIREBASE_CONFIG.apiKey!=="YOUR_API_KEY"){firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();S.online=true;
  auth.onAuthStateChanged(async u=>{if(!u||S.me)return;uid=u.uid;try{const d=docs(await db.collection("accounts").where("uid","==",uid).get());if(d.length){S.me=d[0].id;subs();render()}}catch(e){}});}}catch(e){}
  render()})();
</script></body></html>
